[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-xai-logic"
version = "0.1.0"
description = "Symbolic XAI for Logic Games: train NNs to solve logic puzzles and extract symbolic explanations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "sympy>=1.12",
    "z3-solver>=4.12.2",
    "networkx>=3.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "pytest>=7.4.0",
    "tqdm>=4.66.0",
    "rich>=13.6.0",
    "shap>=0.44.0",
    "lime>=0.2.0.1",
    "torch-geometric>=2.4.0",
]

[project.optional-dependencies]
dev = ["pytest-cov", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
